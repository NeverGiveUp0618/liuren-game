<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>六壬神课 · 已并入六壬课程</title>
<style>
:root{--acc:#7060B0;--bg:#F3F0F9;--ink:#1C0A00;--ink2:#6B5040;--line:#CEC7E8}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.box{max-width:360px;margin:0 16px;padding:28px 22px;background:#FDFCFF;border:1px solid var(--line);border-radius:14px;text-align:center;line-height:1.8}
h1{font-size:20px;margin:0 0 10px;letter-spacing:2px}
p{color:var(--ink2);font-size:14px;margin:6px 0}
a.go{display:inline-block;margin-top:14px;padding:10px 22px;border-radius:22px;background:var(--acc);color:#fff;text-decoration:none;letter-spacing:1px}
small{display:block;margin-top:14px;color:#9B8570;font-size:12px}
</style>
</head>
<body>
<div class="box">
  <h1>六壬神课已并入六壬课程</h1>
  <p>2026 年 10 月起，这里的内容和练习都搬进了「六壬课程」：综合训练、起盘台、毕法赋、格局、象法、课例，以及原 App 的全部资料（在「六壬神课存档」里）。</p>
  <p>盘面按《大六壬通解》发用取上神，与课文一致。</p>
  <a class="go" href="https://nevergiveup0618.github.io/liuren-course/">去六壬课程</a>
  <small id="t">3 秒后自动跳转</small>
</div>
<script>
// 旧 App 没注册过 service worker；保险起见，若有就注销、清缓存，免得手机上一直停在旧版
try { navigator.serviceWorker && navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }); } catch (e) {}
try { window.caches && caches.keys().then(function (ks) { ks.forEach(function (k) { if (/liuren-game|lr_/.test(k)) caches.delete(k); }); }); } catch (e) {}
var U = 'https://nevergiveup0618.github.io/liuren-course/', n = 3;
var iv = setInterval(function () {
  n--; document.getElementById('t').textContent = n + ' 秒后自动跳转';
  if (n <= 0) { clearInterval(iv); location.replace(U); }
}, 1000);
</script>
</body>
</html>
